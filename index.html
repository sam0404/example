<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Simple PWA</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">

<body>
  <nav>
    <h1>VM PWA</h1>
  </nav>
  <header>
    <h2>Изучаем PWA, manifest, Service Workers</h2>
  </header>
  <div
    style="position:absolute;top:0;left:0;width:100%;height:100%;background-color:rgba(0, 0, 0, 0.5);z-index:100;display:none;justify-content:center;align-items:center"
    id="modal">
    <div
      style="background-color:rgba(100, 100, 100, 0.85);border-radius:10px;padding:30px;width:300px;text-align:center;box-shadow:0 4px 8px rgba(0, 0, 0, 0.3);">
      <div style="color:white;font-size:24px;margin-bottom:30px">
        То!Лото</div><button
        style="display:flex;width:100%;padding:12px;margin-top:10px;margin-bottom:10px;margin-left:0;margin-right:0;border-radius:5px;border-width:0;background-color:#4a6fa5;color:white;font-size:16px;cursor:pointer"
        id="install">Установить</button><button
        style="display:flex;width:100%;padding:12px;margin-top:10px;margin-bottom:10px;margin-left:0;margin-right:0;border-radius:5px;border-width:0;background-color:#4a6fa5;color:white;font-size:16px;cursor:pointer"
        id="close">Отмена</button>
    </div>
  </div>
  <div class="container">
    <div id="posts"></div>
  </div>

  <script src="js/app.js"></script>
</body>

</html>
